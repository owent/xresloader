# setup @see https://help.github.com/en/articles/workflow-syntax-for-github-actions
# environment @see https://help.github.com/en/articles/software-in-virtual-environments-for-github-actions
#                  https://help.github.com/en/articles/virtual-environments-for-github-actions
# example     @see https://github.com/actions/toolkit/blob/master/.github/workflows/workflow.yml
name: Main Building
# This workflow is triggered on pushes to the repository.
on: # @see https://help.github.com/en/articles/events-that-trigger-workflows#webhook-events
  push:
    branches: # Array of patterns that match refs/heads
      - master # Push events on master branch
      - main
  pull_request:
    branches:
      - main
  # schedule:
  #  - cron:  0 * * * *

jobs:
  build: # job id, can be any string
    # Job name is Build And Publish
    name: Build
    # This job runs on Linux
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # https://github.com/actions/checkout
        with:
          lfs: true
          submodules: true
      - name: Set up JDK 21
        uses: actions/setup-java@v6 # https://github.com/actions/setup-java
        with:
          distribution: temurin
          java-version: "21"
          java-package: jdk
          architecture: x64
      - name: Build with Maven
        # uses: .github/action/build-with-maven
        run: |
          python3 -m unittest discover -s test/tools -p 'test_*.py'
          cd tools
          python3 -m pip install --user -r requirements.txt
          python3 gen_header_v2.py
          python3 gen_header_v3.py
          cd ..
          sh ./mvnw -Dproject.target.javaVersion=21 clean verify --file pom.xml
          sh ./mvnw clean verify --file pom.xml
          # Repeated packaging must not shade the previous uber JAR again.
          sh ./mvnw verify --file pom.xml
          jar_name=$(python3 -c 'import xml.etree.ElementTree as ET; p = ET.parse("pom.xml").getroot(); ns = "{http://maven.apache.org/POM/4.0.0}"; print(p.findtext(ns + "artifactId") + "-" + p.findtext(ns + "version") + ".jar")')
          echo "XRESLOADER_JAR_NAME=$jar_name" >> "$GITHUB_ENV"
          python3 tools/verify_samples.py --jar "target/$jar_name" --snapshot build/sample-baseline.json --capture
          for parallelism in 1 4 8 auto; do
            python3 tools/verify_samples.py --jar "target/$jar_name" --snapshot build/sample-baseline.json --parallelism "$parallelism"
          done
      - name: Stress cache publication, TLS isolation and ordered output
        run: |
          python3 tools/run_concurrency_stress.py --jar "target/$XRESLOADER_JAR_NAME" --work-dir build/jcstress-ci -- -m quick -iters 2 -time 100 -f 1 -c 2 -hs 128 -af NONE -pth false
      - name: Verify Gradle and compare sample outputs
        run: |
          sh ./gradlew --no-daemon --console=plain --warning-mode=all test shadowJar jacocoTestReport
          python3 tools/verify_samples.py --jar "target/libs/$XRESLOADER_JAR_NAME" --snapshot build/sample-baseline.json --parallelism 4
          # Maven must also package and report coverage after Gradle, without cleaning.
          sh ./mvnw verify --file pom.xml
