# setup @see https://help.github.com/en/articles/workflow-syntax-for-github-actions
# environment @see https://help.github.com/en/articles/software-in-virtual-environments-for-github-actions
#                  https://help.github.com/en/articles/virtual-environments-for-github-actions
# example     @see https://github.com/actions/toolkit/blob/master/.github/workflows/workflow.yml
name: Main Building
# This workflow is triggered on pushes to the repository.
on: # @see https://help.github.com/en/articles/events-that-trigger-workflows#webhook-events
  push:
    branches: # Array of patterns that match refs/heads
      - master # Push events on master branch
      - main
  pull_request:
    branches:
      - main
  # schedule:
  #  - cron:  0 * * * *

jobs:
  build: # job id, can be any string
    # Job name is Build And Publish
    name: Build
    # This job runs on Linux
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # https://github.com/actions/checkout
        with:
          lfs: true
          submodules: true
      - name: Set up JDK 21
        uses: actions/setup-java@v6 # https://github.com/actions/setup-java
        with:
          distribution: temurin
          java-version: "21"
          java-package: jdk
          architecture: x64
      - name: Build with Maven
        # uses: .github/action/build-with-maven
        run: |
          cd tools
          python3 -m pip install --user -r requirements.txt
          python3 gen_header_v2.py
          python3 gen_header_v3.py
          cd ..
          sh ./mvnw -Dproject.target.javaVersion=21 clean verify --file pom.xml
          sh ./mvnw clean verify --file pom.xml
          # Repeated packaging must not shade the previous uber JAR again.
          sh ./mvnw verify --file pom.xml
          python3 tools/verify_samples.py --jar target/xresloader-2.23.7.jar --snapshot build/sample-baseline.json --capture
      - name: Verify Gradle and compare sample outputs
        run: |
          sh ./gradlew --no-daemon --console=plain --warning-mode=all test shadowJar
          python3 tools/verify_samples.py --jar target/libs/xresloader-2.23.7.jar --snapshot build/sample-baseline.json
