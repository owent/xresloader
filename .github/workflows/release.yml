# setup @see https://help.github.com/en/articles/workflow-syntax-for-github-actions
# environment @see https://help.github.com/en/articles/software-in-virtual-environments-for-github-actions
#                  https://help.github.com/en/articles/virtual-environments-for-github-actions
# example     @see https://github.com/actions/toolkit/blob/master/.github/workflows/workflow.yml
name: Release
# This workflow is triggered on pushes to the repository.
on: # @see https://help.github.com/en/articles/events-that-trigger-workflows#webhook-events
  push:
    tags:
      - "*"

jobs:
  build: # job id, can be any string
    # Job name is Build And Publish
    name: Build And Publish
    # This job runs on Linux
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # https://github.com/actions/checkout
        with:
          lfs: true
          submodules: true
          fetch-depth: 0
      - name: Read annotated tag message
        run: |
          python3 -m unittest discover -s test/tools -p 'test_*.py'
          python3 tools/release_notes.py --tag "$RELEASE_TAG" --commit "$BUILD_SHA" --output build/release-notes.md
      - name: Set up JDK 21
        uses: actions/setup-java@v6 # https://github.com/actions/setup-java
        with:
          distribution: temurin
          java-version: "21"
          java-package: jdk
          architecture: x64
      - name: Build with Maven
        run: |
          cd tools
          python3 -m pip install --user -r requirements.txt
          python3 gen_header_v2.py
          python3 gen_header_v3.py
          cd ..
          # Keep both variants outside target so the next clean preserves them.
          mkdir -p build/release-package
          sh ./mvnw -Dproject.target.javaVersion=21 clean verify --file pom.xml
          for JAR_FILE in target/xresloader-*.jar; do
            JAR_BASENAME=$(basename "$JAR_FILE")
            cp "$JAR_FILE" "build/release-package/${JAR_BASENAME/.jar/-jre21.jar}"
          done
          sh ./mvnw -Dproject.target.javaVersion=17 clean verify --file pom.xml
          for JAR_FILE in target/xresloader-*.jar; do
            cp "$JAR_FILE" build/release-package/
          done

          if [[ -e "target/protocols.zip" ]]; then rm -f "target/protocols.zip"; fi
          if [[ -e "target/tools.zip" ]]; then rm -f "target/tools.zip"; fi
          mkdir target/protocols
          cp -rf third_party/xresloader-protocol/core/*.proto third_party/xresloader-protocol/core/extensions header/*.pb target/protocols/
          (cd target/protocols && zip -r "../protocols.zip" *)
          (cd tools && zip -r "../target/tools.zip" requirements.txt extensions.pb *.py)
      - name: Upload release assets and tag message
        id: release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "target/protocols.zip;target/tools.zip;build/release-package/*.jar"
          tags: true
          tag_name: ${{ github.ref_name }}
          default_release_name: ${{ github.ref_name }}
          update_release_body_path: build/release-notes.md
          draft: true
          overwrite: true
      - name: Verify Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > build/release.json
          python3 tools/release_notes.py --tag "$RELEASE_TAG" --commit "$BUILD_SHA" --verify-release build/release.json
