plugins {
    id 'java'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.6.1'
}


group = 'org.xresloader'
version = '2.24.0-beta'
description = 'xresloader'
layout.buildDirectory = layout.projectDirectory.dir('target')

ext {
    targetJava = 17
    targetJavaVersion = JavaVersion.toVersion(targetJava)
    versions = [
        commonsIo: '2.22.0',
        commonsCollections: '4.6.0',
        gson: '2.14.0',
        errorProneAnnotations: '2.50.0',
        xmlbeans: '5.4.1',
        commonsLang: '3.21.0',
        asm: '9.11.1',
        jspecify: '1.0.1',
        nashorn        : '15.7',
        protobuf       : '4.36.2',
        poi            : '5.5.1',
        log4j          : '2.26.1',
        commonsCli     : '1.11.0',
        commonsCodec   : '1.23.0',
        ini4j          : '0.5.4',
        msgpack        : '0.9.12',
        json           : '20260814',
        dom4j          : '2.2.0',
        commonsCsv     : '1.14.1',
        snakeyamlEngine: '3.2',
        spotbugsAnnotations: '4.10.5',
        junitJupiter   : '6.1.3',
        junitPlatform  : '6.1.3'
    ]
}

repositories {
    // maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    // maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

java {
    if (!JavaVersion.current().isCompatibleWith(targetJavaVersion)) {
        toolchain {
            languageVersion = JavaLanguageVersion.of(targetJava)
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ['src', 'header']
        resources.srcDirs = ['src/org/xresloader/core/resource']
    }
    test {
        java.srcDirs = ['test']
    }
}

dependencies {
    constraints {
        implementation("com.google.code.gson:gson:${versions.gson}")
        implementation("com.google.errorprone:error_prone_annotations:${versions.errorProneAnnotations}")
        implementation("org.apache.xmlbeans:xmlbeans:${versions.xmlbeans}")
        implementation("org.apache.commons:commons-lang3:${versions.commonsLang}")
        testImplementation("org.jspecify:jspecify:${versions.jspecify}")
        implementation("org.ow2.asm:asm:${versions.asm}")
        implementation("org.ow2.asm:asm-commons:${versions.asm}")
        implementation("org.ow2.asm:asm-analysis:${versions.asm}")
        implementation("org.ow2.asm:asm-tree:${versions.asm}")
        implementation("org.ow2.asm:asm-util:${versions.asm}")
    }
    implementation "commons-io:commons-io:${versions.commonsIo}"
    implementation "org.apache.commons:commons-collections4:${versions.commonsCollections}"
    implementation "commons-cli:commons-cli:${versions.commonsCli}"
    implementation "commons-codec:commons-codec:${versions.commonsCodec}"
    implementation "org.apache.logging.log4j:log4j-api:${versions.log4j}"
    implementation "org.apache.logging.log4j:log4j-core:${versions.log4j}"
    implementation "org.ini4j:ini4j:${versions.ini4j}"
    implementation "org.msgpack:msgpack-core:${versions.msgpack}"
    implementation "org.json:json:${versions.json}"
    implementation "com.google.protobuf:protobuf-java:${versions.protobuf}"
    implementation "com.google.protobuf:protobuf-java-util:${versions.protobuf}"
    implementation "org.apache.poi:poi-ooxml:${versions.poi}"
    implementation "org.apache.poi:poi:${versions.poi}"
    implementation "org.dom4j:dom4j:${versions.dom4j}"
    implementation "org.apache.commons:commons-csv:${versions.commonsCsv}"
    implementation "org.snakeyaml:snakeyaml-engine:${versions.snakeyamlEngine}"
    implementation "org.openjdk.nashorn:nashorn-core:${versions.nashorn}"

    // Resolve CSVPrinter's class-file annotations without bundling them at runtime.
    compileOnly "com.github.spotbugs:spotbugs-annotations:${versions.spotbugsAnnotations}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${versions.junitJupiter}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${versions.junitJupiter}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${versions.junitPlatform}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJava
    options.compilerArgs += ['-Xlint:all,-options,-path']
}

tasks.test {
    useJUnitPlatform()
    // Packaged JAR integration tests run after Shade via Maven Failsafe (mvn verify).
    exclude '**/*IT.class'
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}

tasks.processResources {
    filteringCharset = 'UTF-8'
    inputs.property('projectVersion', project.version)
    inputs.property('projectName', project.name)
    def expandTokens = [project: [version: project.version, name: project.name]]
    filesMatching('**/*.properties') {
        expand(expandTokens)
    }
    from('header') {
        include '*.pb'
    }
}

tasks.jar {
    archiveClassifier.set('plain')
    manifest {
        attributes(
            'Main-Class': 'org.xresloader.core.Main',
            'Multi-Release': 'true'
        )
    }
}

tasks.shadowJar {
    archiveClassifier.set('')
    // Let the service transformer see all providers before duplicate entries are removed.
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': 'org.xresloader.core.Main',
            'Multi-Release': 'true'
        )
    }
    exclude 'module-info.class'
    exclude 'META-INF/*.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE.txt'
    exclude 'META-INF/NOTICE.txt'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/versions/**/module-info.class'
    dependencies {
        exclude(dependency('junit:junit'))
    }
}

tasks.assemble {
    dependsOn tasks.shadowJar
}
